<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEATS - Conti Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:ital,wght@1,900&family=Kanit:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        /* Base Layout */
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Fredoka', sans-serif; background-color: #f4f7f6; transition: background-color 0.3s; }
        
        .menu-header-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 9990; }
        .left-nav-group { display: flex; align-items: center; gap: 16px; }
        .hamburger-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; padding: 4px 10px; color: inherit; }
        .user-greeting { font-size: 1.1rem; font-weight: 600; color: #333; }
        
        .nav-sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #fff; box-shadow: 4px 0 15px rgba(0,0,0,0.2); transition: 0.3s; padding: 24px; z-index: 10000; display: flex; flex-direction: column; box-sizing: border-box; }
        .nav-sidebar.open { left: 0; }
        .close-menu-btn { align-self: flex-end; border: none; background: none; font-size: 1.5rem; cursor: pointer; margin-bottom: 30px; color: inherit; }
        .sidebar-links { display: flex; flex-direction: column; gap: 20px; flex: 1; }
        .sidebar-links a { text-decoration: none; font-size: 1.15rem; color: #333; font-weight: bold; }
        
        .theme-toggle-row { margin-top: auto; padding-top: 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .theme-switch-btn { background: #fff; border: 1px solid #ddd; border-radius: 20px; padding: 4px 12px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        
        .overlay-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; z-index: 9995; }
        .overlay-screen.show { display: block; }
        
        .log-container-card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 30px; width: 90%; max-width: 1200px; margin: 20px auto; flex: 1; box-sizing: border-box; }
        .header-logo-section { text-align: center; margin-bottom: 25px; }
        .header-logo-section img { max-width: 150px; height: auto; margin-bottom: 10px; display: inline-block; }
        .divider-line { border: none; height: 2px; background: linear-gradient(to right, transparent, #dc2b5c, transparent); margin: 25px 0; }
        
        /* Grid Layout & Form elements */
        .metadata-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; background: rgba(0,0,0,0.02); padding: 20px; border-radius: 8px; margin-bottom: 25px; align-items: flex-end; }
        .meta-field { display: flex; flex-direction: column; gap: 5px; }
        .meta-field label { font-weight: 600; font-size: 0.85rem; color: #555; text-transform: uppercase; }
        
        .meta-field input { box-sizing: border-box !important; height: 44px !important; padding: 10px 12px !important; border: 2px solid #d1d1e0 !important; border-radius: 8px !important; width: 100%; font-family: inherit; font-size: 1rem; background: #fff; color: #000; transition: border-color 0.2s; }
        .meta-field input:focus { outline: none; border-color: #00b4cc !important; }

        .meta-field input[type="date"] { -webkit-appearance: none !important; padding-top: 0 !important; padding-bottom: 0 !important; }
        .meta-field input[type="date"]::-webkit-date-and-time-value { line-height: 44px !important; margin: 0 !important; padding: 0 !important; height: 44px !important; }
        
        .select-group { display: flex; gap: 4px; align-items: center; justify-content: center; }
        .select-group select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; }
        
        .table-responsive-wrapper { margin-bottom: 20px; border: 1px solid #dee2e6; border-radius: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .conti-log-table { width: 100%; border-collapse: collapse; min-width: 950px; }
        .conti-log-table th { background-color: #f8f9fa; color: #333; padding: 12px; border: 1px solid #dee2e6; text-align: center; font-weight: bold; }
        .conti-log-table td { padding: 8px; border: 1px solid #eee; text-align: center; vertical-align: middle; word-wrap: break-word; }
        
        .segment-detail-input { width: 100%; min-height: 40px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: #fff; text-align: left; box-sizing: border-box; color: #000; word-break: break-word; }
        .segment-detail-input[contenteditable="false"] { background: #f0f0f0; cursor: not-allowed; }
        
        .action-btn-cell { display: flex; gap: 6px; justify-content: center; }
        .btn-action { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-save { background: #28a745; } .btn-edit { background: #ffc107; color: #000; } .btn-delete { background: #dc3545; }
        .control-panel-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; gap: 10px; }
        
        .utility-btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-add-row { background-color: #007bff; color: white; }
        .btn-print { background-color: #e2e6ea; color: #000; } 
        .btn-save-all { background-color: #dc2b5c; color: white; }
        
        footer { padding: 20px; text-align: center; font-size: 0.9rem; opacity: 0.8; }

        [data-theme="dark"] body { background-color: #121212 !important; }
        [data-theme="dark"] .log-container-card { background: #1e1e1e; color: #fff; }
        [data-theme="dark"] .menu-header-bar { background: #1e1e1e; color: #fff; border-bottom: 1px solid #333; }
        [data-theme="dark"] .user-greeting { color: #fff; }
        [data-theme="dark"] .nav-sidebar { background: #1e1e1e; color: #fff; }
        [data-theme="dark"] .sidebar-links a { color: #fff; }
        [data-theme="dark"] .meta-field label { color: #aaa; }
        [data-theme="dark"] .meta-field input { background: #2b2b2b; border-color: #444; color: #fff; }
        [data-theme="dark"] .conti-log-table th { background-color: #2d2d2d; color: #fff; border-bottom-color: #444; border-right-color: #444; }
        [data-theme="dark"] .conti-log-table td { border-bottom-color: #333; border-right-color: #333; }
        [data-theme="dark"] .segment-detail-input { background: #2b2b2b; border-color: #444; color: #fff; }
        [data-theme="dark"] .segment-detail-input[contenteditable="false"] { background: #3d3d3d; }
        [data-theme="dark"] .select-group select { background: #2b2b2b; color: #fff; border-color: #444; }

        @media (max-width: 850px) {
            .metadata-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 550px) {
            .metadata-grid { grid-template-columns: 1fr; }
            .log-container-card { width: 95%; padding: 15px; }
        }

        /* PRINT STYLES */
        @media print {
            body { background-color: white !important; color: #000 !important; }
            .no-print, .hamburger-btn, .nav-sidebar, .overlay-screen, .control-panel-footer, .menu-header-bar { display: none !important; }
            .log-container-card { width: 100% !important; max-width: 100% !important; margin: 0; padding: 10px; box-shadow: none; }
            .metadata-grid { background: none !important; border: none !important; display: flex; justify-content: space-between; padding: 10px 0 !important; }
            .meta-field { flex-direction: row; align-items: center; gap: 8px; }
            .meta-field label { color: #000 !important; font-weight: bold; }
            .meta-field input { border: none !important; background: transparent !important; padding: 0 !important; height: auto !important; box-shadow: none !important; font-weight: bold; color: #000 !important; -webkit-appearance: none; appearance: none; width: auto; }
            .conti-log-table { width: 100% !important; min-width: 100% !important; table-layout: fixed; }
            .segment-detail-input { border: none !important; background: transparent !important; padding: 2px !important; color: #000 !important; }
            .select-group { justify-content: center !important; }
            .select-group select { appearance: none; -webkit-appearance: none; border: none !important; background: transparent !important; font-weight: bold; color: #000 !important; padding: 0 !important; }
            .select-group span { display: inline-block !important; margin: 0 2px; font-weight: bold; }
        }
    </style>
</head>
<body>
    <div class="menu-header-bar">
        <div class="left-nav-group">
            <button class="hamburger-btn" id="openMenuToggle">☰</button>
            <div class="user-greeting">Hi, <span id="displayUsername">Guest</span></div>
        </div>
        <div style="font-family: 'Kanit', sans-serif; font-weight: 900; color: #dc2b5c; font-size: 1.5rem;">BEATS</div>
    </div>
    
    <div class="overlay-screen" id="menuOverlay"></div>
    <div class="nav-sidebar" id="sidebarDrawer">
        <button class="close-menu-btn" id="closeMenuToggle">✕</button>
        <div class="sidebar-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="aboutMe.html">About Me</a>
            <a href="SignIn.html" style="color: #ff4d4d; margin-top: 20px;">Logout</a>
        </div>
        <div class="theme-toggle-row">
            <span>Theme Mode</span>
            <button class="theme-switch-btn" id="themeSwitchTrigger">☀️ / 🌙</button>
        </div>
    </div>

    <main class="log-container-card">
        <div class="header-logo-section">
            <img src="https://raw.githubusercontent.com/stanislawa0515-commits/InternshipProject-RTM/main/BINTULUfm.png" alt="BINTULUfm Logo">
            <h2>CATATAN KONTI</h2>
        </div>
        <hr class="divider-line">
        <div class="metadata-grid">
            <div class="meta-field"><label>JH BERTUGAS :</label><input type="text" id="jhBertugas"></div>
            <div class="meta-field"><label>Tarikh :</label><input type="date" id="tarikh"></div>
            <div class="meta-field"><label>Waktu :</label><input type="text" id="waktu" placeholder="e.g. 0900 - 1200"></div>
        </div>

        <div class="table-responsive-wrapper">
            <table class="conti-log-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">Waktu</th>
                        <th style="width: 25%;">Tajuk Rancangan</th>
                        <th style="width: 10%;">L/R</th>
                        <th style="width: 15%;">Penerbit</th>
                        <th style="width: 12%;">Netia/CD</th>
                        <th style="width: 23%;">Catatan</th>
                        <th class="no-print" style="width: 180px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>

        <div class="control-panel-footer">
            <div>
                <button class="utility-btn btn-add-row" onclick="addRow()">➕ Tambah Baris</button>
                <button class="utility-btn btn-print" onclick="window.print()">🖨️ Cetak Jadual</button>
            </div>
            <button class="utility-btn btn-save-all" id="saveBtn">💾 Simpan Semua</button>
        </div>
    </main>

    <footer>&copy; 2026 RTM Bintulu. All rights reserved.</footer>

    <script type="module" src="presence.js"></script>
    <script type="module">
        import { db, doc, setDoc, getDoc } from "./firebase-config.js";

        const sidebar = document.getElementById('sidebarDrawer');
        const overlay = document.getElementById('menuOverlay');
        const displayUsername = document.getElementById('displayUsername');
        const themeSwitchTrigger = document.getElementById('themeSwitchTrigger');
        const logBody = document.getElementById('logBody');
        const tarikhInput = document.getElementById('tarikh');

        const today = new Date().toISOString().split('T')[0];
        tarikhInput.value = today;

        const activeUser = sessionStorage.getItem('activeProfileName') || localStorage.getItem('currentUser') || 'Guest';
        if (displayUsername) displayUsername.textContent = activeUser;

        if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        themeSwitchTrigger.onclick = () => {
            if(document.documentElement.hasAttribute('data-theme')) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        };

        document.getElementById('openMenuToggle').onclick = () => { sidebar.classList.add('open'); overlay.classList.add('show'); };
        document.getElementById('closeMenuToggle').onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); };
        overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); };
        
        window.toggleRowEditable = (btn, isEditable) => {
            const tr = btn.closest('tr');
            tr.querySelectorAll('.segment-detail-input').forEach(el => el.contentEditable = isEditable);
            tr.querySelectorAll('select').forEach(el => el.disabled = !isEditable);
        };

        window.addRow = function(data = {}) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <div class="select-group">
                        <select class="h">${Array.from({length:24},(_,i)=>`<option value="${i.toString().padStart(2,'0')}" ${data.h == i ? 'selected':''}>${i.toString().padStart(2,'0')}</option>`).join('')}</select>
                        <span>:</span>
                        <select class="m">${Array.from({length:60},(_,i)=>`<option value="${i.toString().padStart(2,'0')}" ${data.m == i ? 'selected':''}>${i.toString().padStart(2,'0')}</option>`).join('')}</select>
                    </div>
                </td>
                <td><div contenteditable="true" class="segment-detail-input">${data.tajuk || ''}</div></td>
                <td><div class="select-group"><select class="lr"><option value="L" ${data.lr == 'L' ? 'selected':''}>L</option><option value="R" ${data.lr == 'R' ? 'selected':''}>R</option></select></div></td>
                <td><div contenteditable="true" class="segment-detail-input">${data.penerbit || ''}</div></td>
                <td><div class="select-group"><select class="cd"><option value="--" ${data.cd == '--' ? 'selected':''}>--</option><option value="Netia" ${data.cd == 'Netia' ? 'selected':''}>Netia</option><option value="CD" ${data.cd == 'CD' ? 'selected':''}>CD</option></select></div></td>
                <td><div contenteditable="true" class="segment-detail-input">${data.catatan || ''}</div></td>
                <td class="no-print">
                    <div class="action-btn-cell">
                        <button class="btn-action btn-save" onclick="toggleRowEditable(this, false)">Save</button>
                        <button class="btn-action btn-edit" onclick="toggleRowEditable(this, true)">Edit</button>
                        <button class="btn-action btn-delete" onclick="this.closest('tr').remove()">Delete</button>
                    </div>
                </td>
            `;
            logBody.appendChild(row);
        };

        document.getElementById('saveBtn').onclick = async () => {
            try {
                const dateKey = tarikhInput.value;
                const rows = Array.from(logBody.querySelectorAll('tr')).map(tr => ({
                    h: tr.querySelector('.h').value,
                    m: tr.querySelector('.m').value,
                    tajuk: tr.querySelectorAll('.segment-detail-input')[0].innerText,
                    lr: tr.querySelector('.lr').value,
                    penerbit: tr.querySelectorAll('.segment-detail-input')[1].innerText,
                    cd: tr.querySelector('.cd').value,
                    catatan: tr.querySelectorAll('.segment-detail-input')[2].innerText
                }));

                const jhBertugasVal = document.getElementById('jhBertugas').value || activeUser;
                const timestampNow = Date.now();

                // 1. Save main log document
                await setDoc(doc(db, "beats_conti_logs", activeUser, "dates", dateKey), {
                    jhBertugas: jhBertugasVal,
                    waktu: document.getElementById('waktu').value,
                    rows: rows,
                    updatedAt: timestampNow
                });

                // 2. Dispatch real-time alert to central beats_notifications collection
                const notifDocId = `contilog_${activeUser}_${dateKey}_${timestampNow}`;
                await setDoc(doc(db, "beats_notifications", notifDocId), {
                    id: notifDocId,
                    title: "New Conti Log Entry",
                    message: `User ${activeUser} submitted Conti Log for ${dateKey}`,
                    sourcePage: "contiLog.html",
                    targetUser: activeUser,
                    targetDate: dateKey,
                    timestamp: timestampNow
                });

                alert("Data saved successfully!");
            } catch (err) {
                console.error("Save error: ", err);
                alert("Failed to save: " + err.message);
            }
        };

        async function loadData() {
            try {
                const dateKey = tarikhInput.value;
                const docSnap = await getDoc(doc(db, "beats_conti_logs", activeUser, "dates", dateKey));
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('jhBertugas').value = data.jhBertugas || activeUser;
                    document.getElementById('waktu').value = data.waktu || '';
                    logBody.innerHTML = '';
                    if (data.rows && data.rows.length) {
                        data.rows.forEach(r => addRow(r));
                    } else {
                        addRow();
                    }
                } else {
                    logBody.innerHTML = '';
                    addRow();
                    document.getElementById('jhBertugas').value = activeUser !== 'Guest' ? activeUser : '';
                    document.getElementById('waktu').value = '';
                }
            } catch (err) {
                console.error("Load error: ", err);
            }
        }

        tarikhInput.onchange = loadData;
        loadData();
    </script>
</body>
</html>
